# Projeto Netlify: gotransfer-app-6283 (https://gotransfer-app-6283.netlify.app)
# Publicado pelo GitHub (wramostsw/gotransfers, branch main), com build na nuvem do Netlify.
# Base directory no painel: apps/web
[build]
  command = "npm run build"
  publish = ".next"

# Adaptador oficial de Next.js (rotas, funções de servidor e proxy).
# Sem ele o Netlify publica a pasta .next crua e todas as páginas dão 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
