<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GoTransfer</title>
  <meta name="description" content="GoTransfer: modelo visual do aplicativo.">
  <meta name="theme-color" content="#00268E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GoTransfer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <img src="icons/logo-360.png" alt="" class="splash-logo">
  </div>

  <main class="home">
    <div class="home-hero">
      <img src="icons/logo-360.png" alt="Logo GoTransfer" class="home-logo">
      <h1>GoTransfer</h1>
      <p class="home-tag">Sua agência vende. Nós conectamos o transporte.</p>
    </div>
    <div class="home-actions">
      <button id="installBtn" class="btn" hidden>Instalar o app</button>
      <p class="home-note">Modelo visual · em construção</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
